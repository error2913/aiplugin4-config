<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>角色 / 技能 / MCP / 知识库 / 事件触发交互测试</title></head>
<body>
<h1>角色 / 技能 / MCP / 知识库 / 事件触发交互测试</h1>
<ol id="results"></ol>
<iframe id="frame" src="/index.html" width="1500" height="950"></iframe>
<script>
// 与 dom-test.html 同一套路：iframe 驱动真实页面，从干净草稿开始。
try { localStorage.clear(); } catch (e) { /* ignore */ }
const log = [];
function check(name, cond, extra) {
    log.push((cond ? 'PASS  ' : 'FAIL  ') + name + (cond ? '' : '  :: ' + (extra ?? '')));
}
function render() {
    const ol = document.getElementById('results');
    ol.innerHTML = '';
    for (const line of log) {
        const li = document.createElement('li');
        li.textContent = line;
        ol.appendChild(li);
    }
}
const f = document.getElementById('frame');

f.onload = async () => {
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const w = f.contentWindow;
    const d = f.contentDocument;
    w.confirm = () => true;
    const q = (s) => d.querySelector(s);
    const qa = (s) => [...d.querySelectorAll(s)];
    const shown = (elm) => {
        if (!elm) return false;
        const cs = w.getComputedStyle(elm);
        return cs.display !== 'none' && cs.visibility !== 'hidden';
    };
    const json = (id) => JSON.parse(d.getElementById(id).textContent);
    const clickTab = async (view) => {
        const btn = d.querySelector(`[data-view="${view}"]`);
        btn.click();
        await sleep(30);
    };
    const cardCount = (id) => d.querySelectorAll(`#${id}Cards .dcard:not(.dcard-add)`).length;
    const findBtn = (root, text) => [...root.querySelectorAll('button')].find(b => b.textContent.trim() === text);

    try {
        await sleep(80);

        // ---------- 页签与默认内容 ----------
        check('7 个页签', qa('.view-tab').length === 7, qa('.view-tab').length);
        check('默认显示模型配置', shown(d.getElementById('modelLayout')));
        check('内容分区默认隐藏', !shown(d.getElementById('rolesLayout')) && !shown(d.getElementById('skillsLayout')));

        await clickTab('roles');
        check('切到角色设定', shown(d.getElementById('rolesLayout')) && !shown(d.getElementById('modelLayout')));
        check('角色默认 1 条', cardCount('roles') === 1, cardCount('roles'));
        const rolesDefault = json('rolesPreview');
        check('角色默认内容与插件一致',
            rolesDefault.version === 1 && rolesDefault.roles.length === 1 &&
            rolesDefault.roles[0].name === '测试机器人' &&
            rolesDefault.roles[0].prompt.includes('正在进行开发测试'),
            JSON.stringify(rolesDefault).slice(0, 120));

        // 启用开关：关闭 = 从输出移除，不产生 enabled 键
        const roleToggle = d.querySelector('#rolesCards .dcard input[type="checkbox"]');
        check('角色卡片有启用开关', !!roleToggle);
        roleToggle.checked = false;
        roleToggle.dispatchEvent(new w.Event('change', { bubbles: true }));
        await sleep(40);
        const rolesOff = json('rolesPreview');
        check('停用角色后输出为空', rolesOff.roles.length === 0, JSON.stringify(rolesOff));
        check('角色输出不含 enabled 键', !JSON.stringify(rolesOff).includes('"enabled"'));
        roleToggle.checked = true;
        roleToggle.dispatchEvent(new w.Event('change', { bubbles: true }));
        await sleep(40);

        await clickTab('skills');
        check('技能默认 1 条', cardCount('skills') === 1, cardCount('skills'));
        const skillsDefault = json('skillsPreview');
        check('技能默认名 = 录卡', skillsDefault.skills[0].name === '录卡');
        check('技能默认正文非空', skillsDefault.skills[0].content.length > 100);

        await clickTab('mcp');
        check('MCP 默认 4 台', cardCount('mcp') === 4, cardCount('mcp'));
        const mcpDefault = json('mcpPreview');
        check('MCP 输出标准 mcpServers 对象', !!mcpDefault.mcpServers && !Array.isArray(mcpDefault.mcpServers));
        check('MCP 默认包含 mcp-files-exec / md-html-render / mcp-browser / image-host',
            Object.keys(mcpDefault.mcpServers).join(',') === 'mcp-files-exec,md-html-render,mcp-browser,image-host');
        check('md-html-render 限定 QQ',
            JSON.stringify(mcpDefault.mcpServers['md-html-render'].platform) === '["QQ"]');
        check('image-host 指向图床 MCP 端口',
            mcpDefault.mcpServers['image-host'].url === 'http://127.0.0.1:46680/mcp');

        await clickTab('kb');
        check('知识库默认 3 个', cardCount('kb') === 3, cardCount('kb'));
        const kbDefault = json('kbPreview');
        check('知识库默认包含 3 个库', kbDefault.libraries.length === 3);
        check('ob11-api 限定 QQ',
            JSON.stringify(kbDefault.libraries[2].platform) === '["QQ"]');

        // ---------- 返回模型页不丢 ----------
        await clickTab('model');
        check('切回模型配置', shown(d.getElementById('modelLayout')) && !shown(d.getElementById('kbLayout')));
        check('模型页预览仍存在', d.getElementById('preview').textContent.length > 10);

        // ---------- 角色：添加 / 编辑 ----------
        await clickTab('roles');
        d.querySelector('#rolesCards .dcard-add').click();
        await sleep(30);
        check('打开角色编辑面板', shown(d.getElementById('domainPanel')));
        const nameInput = d.getElementById('domainField_roles_name');
        const promptInput = d.getElementById('domainField_roles_prompt');
        nameInput.value = '新角色';
        nameInput.dispatchEvent(new w.Event('input', { bubbles: true }));
        promptInput.value = '你是新角色。';
        promptInput.dispatchEvent(new w.Event('input', { bubbles: true }));
        d.getElementById('domainPanelSave').click();
        await sleep(50);
        check('角色卡数量 +1', cardCount('roles') === 2, cardCount('roles'));
        const rolesAfter = json('rolesPreview');
        check('新增角色进入输出',
            rolesAfter.roles[1].name === '新角色' && rolesAfter.roles[1].prompt === '你是新角色。',
            JSON.stringify(rolesAfter.roles));

        // 草稿持久化（debounce 350ms）
        await sleep(500);
        check('角色草稿已写入 localStorage',
            (w.localStorage.getItem('aiplugin4-config-roles-draft') || '').includes('新角色'));

        // ---------- 角色：恢复默认 ----------
        d.getElementById('rolesReset').click();
        await sleep(30);
        check('恢复默认后角色回到 1 条', cardCount('roles') === 1, cardCount('roles'));

        // ---------- 导入 / 非法导入 ----------
        d.getElementById('rolesImportOpen').click();
        await sleep(20);
        check('导入使用统一对话框', shown(d.getElementById('importPanel')));
        d.getElementById('importText').value = JSON.stringify({ version: 1, roles: [{ name: '导入角色', prompt: '导入内容' }] });
        d.getElementById('importConfirm').click();
        await sleep(40);
        const rolesImported = json('rolesPreview');
        check('导入 JSON 生效', rolesImported.roles[0].name === '导入角色');

        d.getElementById('rolesImportOpen').click();
        await sleep(20);
        d.getElementById('importText').value = '{bad json';
        d.getElementById('importConfirm').click();
        await sleep(30);
        check('非法导入显示错误', !d.getElementById('importMsg').hidden);
        check('非法导入不改动内容', json('rolesPreview').roles[0].name === '导入角色');
        // 关掉统一对话框，避免遮挡后续点击
        d.getElementById('importCancel').click();
        await sleep(20);

        // ---------- 校验阻断复制 ----------
        d.querySelector('#rolesCards .dcard-add').click();
        await sleep(30);
        d.getElementById('domainPanelSave').click(); // 空名称/空内容
        await sleep(40);
        check('空角色触发校验错误', !d.getElementById('rolesValidation').hidden);
        check('校验错误时复制按钮禁用', d.getElementById('rolesCopy').disabled);
        // 删掉空角色
        const emptyCard = qa('#rolesCards .dcard').find(card => card.textContent.includes('（未命名）'));
        findBtn(emptyCard, '删除').click();
        await sleep(40);
        check('删除空角色后复制恢复', !d.getElementById('rolesCopy').disabled);

        // ---------- MCP：遮蔽 / 单服务器停用 ----------
        await clickTab('mcp');
        d.getElementById('mcpMask').checked = true;
        d.getElementById('mcpMask').dispatchEvent(new w.Event('change', { bubbles: true }));
        const maskedText = d.getElementById('mcpPreview').textContent;
        check('遮蔽后不含 Bearer token', !maskedText.includes('Bearer token'), maskedText.slice(0, 160));
        check('遮蔽后有占位符', maskedText.includes('"xxxx"'));
        d.getElementById('mcpMask').checked = false;
        d.getElementById('mcpMask').dispatchEvent(new w.Event('change', { bubbles: true }));

        const firstMcpCard = d.querySelector('#mcpCards .dcard');
        const mcpToggle = firstMcpCard.querySelector('input[type="checkbox"]');
        check('MCP 卡片有启用开关', !!mcpToggle);
        mcpToggle.checked = false;
        mcpToggle.dispatchEvent(new w.Event('change', { bubbles: true }));
        await sleep(50);
        const mcpAfter = json('mcpPreview');
        check('停用后 MCP 服务器从输出移除', !('mcp-files-exec' in mcpAfter.mcpServers),
            JSON.stringify(Object.keys(mcpAfter.mcpServers)));
        check('MCP 输出不含 enabled 键', !JSON.stringify(mcpAfter).includes('"enabled"'));
        mcpToggle.checked = true;
        mcpToggle.dispatchEvent(new w.Event('change', { bubbles: true }));
        await sleep(40);

        // ---------- 文件导入（技能） ----------
        await clickTab('skills');
        const before = cardCount('skills');
        const dt = new w.DataTransfer();
        const file = new w.File(['---\nname: 文件技能\ndescription: 来自文件\nplatform: [QQ]\n---\n# 正文\n内容'], 'from-file.md', { type: 'text/markdown' });
        dt.items.add(file);
        const zone = d.getElementById('skillsDrop');
        const ev = new w.Event('drop', { bubbles: true, cancelable: true });
        Object.defineProperty(ev, 'dataTransfer', { value: dt });
        zone.dispatchEvent(ev);
        await sleep(400);
        check('文件导入后技能 +1', cardCount('skills') === before + 1, `${before} -> ${cardCount('skills')}`);
        const skillsAfter = json('skillsPreview');
        const importedSkill = skillsAfter.skills.find(s => s.name === '文件技能');
        check('文件导入解析 name/description/platform',
            !!importedSkill && importedSkill.description === '来自文件' &&
            JSON.stringify(importedSkill.platform) === '["QQ"]',
            JSON.stringify(importedSkill));

        // ---------- 知识库：添加库 ----------
        await clickTab('kb');
        d.querySelector('#kbCards .dcard-add').click();
        await sleep(30);
        const kbName = d.getElementById('domainField_kb_name');
        const kbContent = d.getElementById('domainField_kb_content');
        kbName.value = '新库';
        kbName.dispatchEvent(new w.Event('input', { bubbles: true }));
        kbContent.value = '# 新库\n\n内容';
        kbContent.dispatchEvent(new w.Event('input', { bubbles: true }));
        d.getElementById('domainPanelSave').click();
        await sleep(40);
        const kbAfter = json('kbPreview');
        check('知识库可新增', kbAfter.libraries.some(l => l.name === '新库'), JSON.stringify(kbAfter.libraries.map(l => l.name)));

        // ---------- 事件触发：中文事件下拉 / 英文预设 / 条件编辑器 / 停用不写入 ----------
        await clickTab('eventTrigger');
        check('切到事件触发', shown(d.getElementById('eventTriggerLayout')) && !shown(d.getElementById('kbLayout')));
        check('事件触发默认 0 条', cardCount('eventTrigger') === 0, cardCount('eventTrigger'));
        const etDefault = json('eventTriggerPreview');
        check('事件触发默认输出空规则',
            etDefault.version === 1 && etDefault.rules.length === 0, JSON.stringify(etDefault));

        const etField = (key) => d.getElementById(`domainField_eventTrigger_${key}`);
        const etChange = (key, value) => {
            const control = etField(key);
            control.value = value;
            control.dispatchEvent(new w.Event('change', { bubbles: true }));
        };

        d.querySelector('#eventTriggerCards .dcard-add').click();
        await sleep(30);
        check('打开事件触发编辑面板', shown(d.getElementById('domainPanel')));
        check('没有规则名字段', !etField('name'));
        check('没有工具调用字段', !etField('toolChoice'));
        check('事件下拉默认选第一个事件', etField('on').value === 'group_increase', etField('on').value);
        check('默认自动填英文预设', etField('prompt').value.includes('A new member joined the group'), etField('prompt').value);
        check('作用范围默认折叠在高级选项',
            !!etField('platforms') && !!etField('platforms').closest('details') && !etField('platforms').closest('details').open);

        // 选戳一戳：自动英文预设 + is_target_bot 条件
        etChange('on', 'poke');
        await sleep(30);
        check('戳一戳自动填英文预设', etField('prompt').value.includes('Someone poked you'), etField('prompt').value);
        let etRows = [...d.querySelectorAll('#domainField_eventTrigger_match_list .cond-row')];
        check('戳一戳自动带 1 条默认条件', etRows.length === 1, etRows.length);
        check('戳一戳默认条件 is_target_bot = true',
            etRows[0]?.querySelector('.cond-field')?.value === 'is_target_bot'
            && etRows[0]?.querySelector('.cond-value')?.value === 'true',
            etRows[0] && etRows[0].textContent);
        const etJson = etField('match_json');
        check('条件 JSON 与行编辑器同步',
            JSON.parse(etJson.value)[0]?.field === 'is_target_bot', etJson.value);

        // 条件行增删
        etField('match_add').click();
        await sleep(20);
        check('添加条件行', d.querySelectorAll('#domainField_eventTrigger_match_list .cond-row').length === 2);
        etRows = [...d.querySelectorAll('#domainField_eventTrigger_match_list .cond-row')];
        etRows[1].querySelector('.cond-del').click();
        await sleep(20);
        check('删除条件行', d.querySelectorAll('#domainField_eventTrigger_match_list .cond-row').length === 1);

        // 直接编辑 JSON → 行编辑器同步
        const etJson2 = etField('match_json');
        etJson2.value = '[{"field":"user_id","regex":"^QQ:100"}]';
        etJson2.dispatchEvent(new w.Event('input', { bubbles: true }));
        await sleep(20);
        check('直接编辑 JSON 同步到条件行',
            d.querySelectorAll('#domainField_eventTrigger_match_list .cond-row')[0]?.querySelector('.cond-field')?.value === 'user_id');

        // 改 prompt 后切事件不覆盖；恢复预设
        const etPrompt = etField('prompt');
        etPrompt.value = 'custom prompt stays';
        etPrompt.dispatchEvent(new w.Event('input', { bubbles: true }));
        etChange('on', 'group_decrease');
        await sleep(30);
        check('改过的 prompt 切换事件不覆盖', etField('prompt').value === 'custom prompt stays', etField('prompt').value);
        etField('prompt_action').click();
        await sleep(30);
        check('恢复预设提示词', etField('prompt').value.includes('A member left the group'), etField('prompt').value);

        // 自定义事件
        etChange('on', '');
        await sleep(30);
        check('选自定义事件后显示事件名输入框', shown(etField('customOn')));
        check('自定义事件填通用兜底提示词', etField('prompt').value.includes('An event occurred'), etField('prompt').value);
        const etCustom = etField('customOn');
        etCustom.value = 'future_event';
        etCustom.dispatchEvent(new w.Event('input', { bubbles: true }));
        d.getElementById('domainPanelSave').click();
        await sleep(60);
        check('事件触发规则 +1', cardCount('eventTrigger') === 1, cardCount('eventTrigger'));
        check('卡片标题显示自定义事件名',
            d.querySelector('#eventTriggerCards .dcard-title')?.textContent === 'future_event',
            d.querySelector('#eventTriggerCards .dcard-title')?.textContent);
        const etAfter = json('eventTriggerPreview');
        check('事件触发输出规则（无 name / toolChoice）',
            etAfter.rules.length === 1
            && etAfter.rules[0].on === 'future_event'
            && etAfter.rules[0].prompt.includes('An event occurred')
            && etAfter.rules[0].match[0]?.field === 'user_id'
            && etAfter.rules[0].match[0]?.regex === '^QQ:100'
            && !('name' in etAfter.rules[0])
            && !('toolChoice' in etAfter.rules[0]),
            JSON.stringify(etAfter));
        check('未知自定义事件给出提示', !d.getElementById('eventTriggerValidation').hidden);
        check('提示不影响复制', !d.getElementById('eventTriggerCopy').disabled);

        // 第二条规则：戳一戳（验证预设可直接保存）
        d.querySelector('#eventTriggerCards .dcard-add').click();
        await sleep(30);
        etChange('on', 'poke');
        await sleep(30);
        d.getElementById('domainPanelSave').click();
        await sleep(60);
        const etTwo = json('eventTriggerPreview');
        check('戳一戳规则输出预置条件',
            etTwo.rules.length === 2
            && etTwo.rules[1].on === 'poke'
            && etTwo.rules[1].match[0]?.field === 'is_target_bot'
            && etTwo.rules[1].match[0]?.equals === true
            && etTwo.rules[1].prompt.includes('Someone poked you'),
            JSON.stringify(etTwo.rules[1]));

        // 停用第一条 → 不写入输出
        const etToggles = [...d.querySelectorAll('#eventTriggerCards .dcard input[type="checkbox"]')];
        etToggles[0].checked = false;
        etToggles[0].dispatchEvent(new w.Event('change', { bubbles: true }));
        await sleep(40);
        const etOff = json('eventTriggerPreview');
        check('停用规则不写入输出', etOff.rules.length === 1 && etOff.rules[0].on === 'poke', JSON.stringify(etOff));
        etToggles[0].checked = true;
        etToggles[0].dispatchEvent(new w.Event('change', { bubbles: true }));
        await sleep(40);

        // ---------- 深链 / 页签按钮状态 ----------
        check('当前页签按钮 aria-selected',
            d.querySelector('[data-view="eventTrigger"]').getAttribute('aria-selected') === 'true');
    } catch (e) {
        check('测试过程未抛异常', false, e instanceof Error ? e.stack : String(e));
    }
    render();
    document.title = `DONE ${log.filter(x => x.startsWith('FAIL')).length}`;
};
</script>
</body>
</html>
