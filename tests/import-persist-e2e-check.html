<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>导入后 Key 是否保留</title>
<style>html,body{margin:0;background:#111;color:#eee;font:14px monospace}iframe{border:0;display:block;width:1400px;height:840px}</style>
</head>
<body>
<pre id="out">running…</pre>
<script>
// 用户的真实流程：**导入一份含 Key 的配置** → 刷新 → Key 还在吗？
// 与 persist-e2e-check 的区别：那条走"面板手输 + 保存"，这条走"导入"。
//
//   #write   清空 → 导入含 Key 的配置 → 报告 localStorage
//   #read    不清空 → 只读，看面板/预览里的 Key
//   #save    不清空 → 导入后打开面板点保存 → 报告
const mode = location.hash.replace('#', '') || 'write';
const lines = [];
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const LS_KEY = 'aiplugin4-config-v5-draft';
const SECRET = 'sk-IMPORTED-KEY-98765';
const done = (s) => {
  document.getElementById('out').textContent = lines.join('\n');
  document.body.insertAdjacentHTML('beforeend', '<div id="summary">SUMMARY ' + s + '</div>');
};

const IMPORT_CFG = JSON.stringify({
  version: 5,
  providers: [
    {
      api: 'openai-completions', baseURL: 'https://api.deepseek.com/v1', apiKey: SECRET,
      models: [{ id: 'flash', name: 'deepseek-v4-flash', kind: 'text' }],
    },
    {
      api: 'openai-completions',
      baseURL: 'https://llm-w67ttc0b3gqiltm8.cn-beijing.maas.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation',
      apiKey: SECRET,
      models: [{ id: 'q', name: 'qwen-image-3.0-pro', kind: 'gen' }],
    },
  ],
  purposes: { chat: 'flash', 'image-generation': 'q' },
});

(async () => {
  try {
    if (mode === 'write') localStorage.removeItem(LS_KEY);
    const before = localStorage.getItem(LS_KEY);
    lines.push('[' + mode + '] 加载前存档: ' + (before ? before.slice(0, 60) + '…' : '(无)'));

    const frame = document.createElement('iframe');
    frame.src = '/index.html';
    document.body.appendChild(frame);
    await new Promise((res) => { frame.onload = res; });
    await sleep(300);

    const w = frame.contentWindow, d = frame.contentDocument;
    const q = (s) => d.querySelector(s);
    const ls = () => w.localStorage.getItem(LS_KEY) || '';
    const keysInLs = () => (ls().match(/"apiKey":"([^"]*)"/g) || []).join(' ');

    if (mode === 'write') {
      d.getElementById('importBtn').click();
      await sleep(150);
      d.getElementById('importText').value = IMPORT_CFG;
      d.getElementById('importConfirm').click();
      await sleep(900);   // 等 300ms 防抖落盘

      const preview = d.getElementById('preview').textContent;
      lines.push('导入后预览里的 Key: '
        + JSON.stringify((preview.match(/"apiKey":"([^"]*)"/) || [])[1] || ''));
      lines.push('导入后 localStorage 里的 apiKey: ' + keysInLs());
      lines.push('  → 含 Key: ' + ls().includes(SECRET));
      done('importWrote=' + ls().includes(SECRET));
      return;
    }

    if (mode === 'save') {
      d.getElementById('importBtn').click();
      await sleep(150);
      d.getElementById('importText').value = IMPORT_CFG;
      d.getElementById('importConfirm').click();
      await sleep(400);
      // 打开第二条连接（专属域名那条）并点保存
      const cards = [...d.querySelectorAll('.pcard')].filter((c) => !c.classList.contains('pcard-add'));
      lines.push('导入后连接卡数: ' + cards.length);
      cards[cards.length - 1].querySelector('.btn-edit').click();
      await sleep(300);
      const keyIn = q('#panelBody .key-row input');
      lines.push('面板里的 Key: ' + JSON.stringify(keyIn ? keyIn.value : '(没开)'));
      d.getElementById('panelSave').click();
      await sleep(900);
      lines.push('点保存后 localStorage 里的 apiKey: ' + keysInLs());
      done('afterSave=' + ls().includes(SECRET));
      return;
    }

    // read：等价于刷新
    const cards = [...d.querySelectorAll('.pcard')].filter((c) => !c.classList.contains('pcard-add'));
    lines.push('刷新后（第二次加载）：');
    lines.push('  加载时存档里的 apiKey: ' + ((before || '').match(/"apiKey":"([^"]*)"/g) || []).join(' '));
    lines.push('  连接卡数 = ' + cards.length);
    if (cards.length) {
      cards[0].querySelector('.btn-edit').click();
      await sleep(300);
      const keyIn = q('#panelBody .key-row input');
      lines.push('  面板里的 Key = ' + JSON.stringify(keyIn ? keyIn.value : '(没开)'));
      d.getElementById('panelCancel').click();
      await sleep(150);
    }
    const preview = d.getElementById('preview').textContent;
    lines.push('  预览里的 Key = '
      + JSON.stringify((preview.match(/"apiKey":"([^"]*)"/) || [])[1] || ''));
    done('refreshKeepsKey=' + preview.includes(SECRET));
  } catch (e) {
    lines.push('ERROR: ' + (e && e.stack || e));
    done('ERROR ' + (e && e.message || e));
  }
})();
</script>
</body>
</html>
