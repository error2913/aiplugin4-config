<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>vendor 与 URL 形态不匹配的提示</title>
<style>html,body{margin:0;background:#111;color:#eee;font:14px monospace}iframe{border:0;display:block;width:1400px;height:800px}</style>
</head>
<body>
<pre id="out">running…</pre>
<script>
// 回归测试：provider 与 baseURL 形态混搭时，界面上必须出警示。
// 这条来自一次真实 404：compatible-mode/v1 + provider=dashscope
// 会拼出 .../compatible-mode/v1/api/v1/services/aigc/... → 404（响应体还是空的，无从查起）。
const lines = [];
const results = [];
const check = (name, cond, extra) => {
    results.push({ name, cond: !!cond });
    lines.push((cond ? 'PASS  ' : 'FAIL  ') + name + (cond || extra == null ? '' : '  :: ' + extra));
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

(async () => {
    try {
        localStorage.setItem('aiplugin4-config-v5-draft', JSON.stringify({
            providers: [{
                uid: 'u1', templateId: 'custom', mode: 'custom', provider: 'dashscope',
                api: 'openai-completions',
                baseURL: 'https://llm-w67ttc0b3gqiltm8.cn-beijing.maas.aliyuncs.com/compatible-mode/v1',
                apiKey: 'sk-x',
                models: [{ id: 'img', name: 'qwen-image-3.0-pro', kind: 'gen' }],
                enabled: true, displayName: '', timeout: 0, request: {},
            }],
            purposes: { 'image-generation': ['img'] }, useBodies: {}, extraGroups: [],
        }));

        const f = document.createElement('iframe');
        f.src = '/index.html';
        document.body.appendChild(f);
        await new Promise((r) => { f.onload = r; });
        await sleep(300);

        const d = f.contentDocument;
        const q = (s) => d.querySelector(s);
        const pq = (s) => d.querySelector('#panelBody ' + s);

        q('.pcard .btn-edit').click();
        await sleep(250);

        const note = () => (pq('.field-note.vendor-warn') || {}).textContent || '';
        check('兼容模式 + dashscope → 出警示', /兼容模式/.test(note()), JSON.stringify(note().slice(0, 120)));
        // 警示文案已压短：不再逐字解释 404 后果，改为断言它点明了「会拼错」
    check('  警示说明了后果（会拼错）', /拼错/.test(note()), JSON.stringify(note().slice(0, 120)));
        check('  警示给出了正确值 alibaba', /alibaba/.test(note()));
        check('  警示有独立的样式类（黄字）', !!pq('.field-note.vendor-warn'));

        // 改成 alibaba → 警示消失
        const vInput = pq('#vendorOptions');
        check('找到供应商下拉框', !!vInput, vInput ? vInput.value : '(没找到)');
        if (vInput) {
            vInput.value = 'alibaba';
            vInput.dispatchEvent(new f.contentWindow.Event('change', { bubbles: true }));
            await sleep(150);
            check('改成 alibaba 后警示消失', !/兼容模式/.test(note()), JSON.stringify(note().slice(0, 120)));
        }

        // 换成原生地址 + dashscope → 也不该警示
        const urlInput = [...d.querySelectorAll('#panelBody input')].find((i) => /^https?:/.test(i.value));
        check('找到 API 地址输入框', !!urlInput, urlInput ? urlInput.value : '(没找到)');
        if (urlInput && vInput) {
            vInput.value = 'dashscope';
            vInput.dispatchEvent(new f.contentWindow.Event('change', { bubbles: true }));
            urlInput.value = 'https://llm-w67ttc0b3gqiltm8.cn-beijing.maas.aliyuncs.com';
            urlInput.dispatchEvent(new f.contentWindow.Event('input', { bubbles: true }));
            await sleep(150);
            check('原生地址 + dashscope → 不警示', !/兼容模式/.test(note()), JSON.stringify(note().slice(0, 120)));
        }

        const failed = results.filter((r) => !r.cond);
        lines.push('');
        lines.push('SUMMARY ' + results.length + ' 项，失败 ' + failed.length);
        document.getElementById('out').textContent = lines.join('\n');
        document.body.insertAdjacentHTML('beforeend',
            '<div id="summary">RESULT ' + (results.length - failed.length) + ' passed / ' + failed.length + ' failed</div>');
    } catch (e) {
        document.getElementById('out').textContent = lines.join('\n') + '\n\nERROR: ' + (e && e.stack || e);
        document.body.insertAdjacentHTML('beforeend', '<div id="summary">SUMMARY ERROR ' + (e && e.message || e) + '</div>');
    }
})();
</script>
</body>
</html>
