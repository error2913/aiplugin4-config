<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>DOM 交互测试 v5</title></head>
<body>
<h1>交互测试 v5</h1>
<ol id="results"></ol>
<iframe id="frame" src="/index.html" width="1500" height="950"></iframe>
<script>
// 测试必须从**干净状态**开始：生成器会把草稿存 localStorage，
// 上一次运行（或手动操作过页面）的存档会让断言基于错误的前提。
try { localStorage.clear(); } catch (e) { /* 隐私模式等忽略 */ }

// 在 iframe 里驱动真实页面，断言 v5 交互行为。
const log = [];
function check(name, cond, extra) {
    log.push((cond ? 'PASS  ' : 'FAIL  ') + name + (cond ? '' : '  :: ' + (extra ?? '')));
}
const f = document.getElementById('frame');

f.onload = async () => {
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const w = f.contentWindow;
    const d = f.contentDocument;
    // headless 下 confirm 默认阻塞，统一放行
    w.confirm = () => true;
    try {
        const q = (s) => d.querySelector(s);
        const qa = (s) => [...d.querySelectorAll(s)];
        // 注意：必须把面板内查询限定在 #panelBody —— 主界面的「用途绑定」有 8 个 select，
        // 在 DOM 里排在面板之前，全局查询会先命中它们。
        const pq = (s) => d.querySelector('#panelBody ' + s);
        const pqa = (s) => [...d.querySelectorAll('#panelBody ' + s)];
        const preview = () => d.getElementById('preview').textContent;
        const parsePreview = () => JSON.parse(preview());

        // 关键：断言「是否真的可见」，而不是 el.hidden 属性。
        // 教训：`.panel{display:flex}` 这类作者样式会压过 UA 的 [hidden]{display:none}，
        // 于是 hidden=true 但元素仍然显示 —— 只看属性会漏掉这类 bug。
        const shown = (elm) => {
            if (!elm) return false;
            const cs = w.getComputedStyle(elm);
            return cs.display !== 'none' && cs.visibility !== 'hidden';
        };
        const panelShown = () => shown(d.getElementById('panel'));
        const backdropShown = () => shown(d.getElementById('panelBackdrop'));

        // ---------- 初始状态 ----------
        check('初始 1 张连接卡 + 1 张添加卡', qa('.pcard').length === 2, qa('.pcard').length);
        check('存在「+ 添加」卡', !!q('.pcard-add'));
        check('初始出厂示例是 deepseek', /deepseek/.test(preview()), preview().slice(0, 80));
        check('初始无 API Key → 显示校验错误', !d.getElementById('validationBox').hidden);
        check('校验错误阻断复制', d.getElementById('copyBtn').disabled);
        check('初始用途绑定已渲染', qa('.purpose-block').length === 8, qa('.purpose-block').length);

        // ---------- 用途绑定：卡片列表 + 取用顺序角标 ----------
        {
            const blocks = qa('.purpose-block');
            check('不再有下拉菜单', qa('.purpose-row').length === 0);
            check('每块都有标题与顺序摘要',
                blocks.every(b => b.querySelector('.purpose-label') && b.querySelector('.purpose-order')));

            // 出厂示例绑了 chat/compression/summarization/judge 四个用途（各 1 个 flash）
            const pickedAll = qa('.purpose-chip.picked');
            check('已绑定卡片数与出厂绑定一致', pickedAll.length === 4, String(pickedAll.length));
            check('已绑定卡片的角标都是 1（各用途只绑一个）',
                pickedAll.every(c => c.querySelector('.rank-badge').textContent === '1'),
                JSON.stringify(pickedAll.map(c => c.querySelector('.rank-badge').textContent)));

            const labels = qa('.purpose-chip').map(c => c.textContent);
            check('卡片不含「自动」字样（会被读成"插件随便挑"）',
                !labels.some(t => /自动/.test(t)),
                JSON.stringify(labels.filter(t => /自动/.test(t)).slice(0, 3)));
            check('卡片不含「将用 X」之类无法兑现的承诺',
                !labels.some(t => /将用|将使用/.test(t)),
                JSON.stringify(labels.filter(t => /将用|将使用/.test(t)).slice(0, 3)));

            const intro = qa('.purpose-intro').map(e => e.textContent).join('');
            check('说明写清取用顺序语义而非"自动挑"',
                /取用顺序/.test(intro) && !/自动/.test(intro), intro);

            // 无可用模型的用途：不给卡片，给出原因
            const emptyBlocks = blocks.filter(b => b.querySelectorAll('.purpose-chip').length === 0);
            check('无可用模型的用途不给卡片', emptyBlocks.length > 0, String(emptyBlocks.length));
            check('无可用模型时说明所需类型',
                emptyBlocks.every(b => {
                    const why = b.querySelector('.purpose-why');
                    return why && /需要/.test(why.textContent);
                }),
                JSON.stringify(emptyBlocks.map(b => (b.querySelector('.purpose-why') || {}).textContent)));
        }

        // ---------- 编辑面板 ----------
        check('初始面板不可见', !panelShown());
        q('.pcard .btn-edit').click();                     // 「编辑」
        check('编辑面板打开', panelShown());
        check('打开时遮罩可见', backdropShown());
        check('面板标题为「编辑连接」', d.getElementById('panelTitle').textContent === '编辑连接');
        check('存在两种模式分段', pqa('.seg-btn').length === 2);
        check('模式 A 默认选中', pqa('.seg-btn')[0].classList.contains('active'));
        check('无「高级自定义」折叠区（必填项不再被藏）', !pq('.adv'));

        // ---------- 关闭：× 按钮（真实可见性断言） ----------
        d.getElementById('panelClose').click();
        check('点 × 后面板真的不可见', !panelShown(), w.getComputedStyle(d.getElementById('panel')).display);
        check('点 × 后遮罩也隐藏', !backdropShown());

        // ---------- 关闭：取消按钮 ----------
        q('.pcard .btn-edit').click();
        check('重新打开面板', panelShown());
        d.getElementById('panelCancel').click();
        check('点取消后面板不可见', !panelShown());
        check('取消后不写回草稿改动', /"apiKey":""/.test(preview()), preview().slice(0, 120));

        // ---------- 关闭：点遮罩 ----------
        q('.pcard .btn-edit').click();
        d.getElementById('panelBackdrop').click();
        check('点遮罩后面板不可见', !panelShown());

        // ---------- 关闭：新增流程（用户报告关不掉的路径） ----------
        q('.pcard-add').click();
        check('新增面板打开', panelShown());
        check('新增面板标题', d.getElementById('panelTitle').textContent === '添加连接');
        d.getElementById('panelClose').click();
        check('新增面板点 × 能关掉', !panelShown());
        q('.pcard-add').click();
        d.getElementById('panelCancel').click();
        check('新增面板点取消能关掉', !panelShown());
        q('.pcard-add').click();
        d.getElementById('panelBackdrop').click();
        check('新增面板点遮罩能关掉', !panelShown());
        check('关掉后未新增连接', qa('.pcard').length === 2, qa('.pcard').length);

        // 回到编辑第一条，继续后续用例
        q('.pcard .btn-edit').click();
        check('面板可重新打开', panelShown());

        // 填 API Key
        const keyIn = pq('.key-row input');
        keyIn.value = 'sk-test-123';
        keyIn.dispatchEvent(new w.Event('input', { bubbles: true }));
        d.getElementById('panelSave').click();
        check('保存后面板关闭', !panelShown());
        check('保存后遮罩隐藏', !backdropShown());
        check('保存后校验通过', d.getElementById('validationBox').hidden,
            d.getElementById('validationBox').textContent);
        check('输出含 apiKey', /"apiKey":"sk-test-123"/.test(preview()), preview().slice(0, 120));
        check('复制按钮已启用', !d.getElementById('copyBtn').disabled);

        // ---------- 模式切换保留内容 ----------
        q('.pcard .btn-edit').click();
        const beforeKey = pq('.key-row input').value;
        pqa('.seg-btn')[1].click();                    // 切到自定义 URL
        check('切模式后 API Key 保留', pq('.key-row input').value === beforeKey, pq('.key-row input').value);
        // 注意：不能用 `.field select` 判断——「协议」下拉也在面板里，会被误命中。
        // 改判「供应商」这个 label。
        const hasVendorField = () => pqa('.field .field-label').some(l => l.textContent === '供应商');
        check('自定义模式无供应商下拉', !hasVendorField());
        pqa('.seg-btn')[0].click();                    // 切回
        check('切回后 API Key 仍在', pq('.key-row input').value === beforeKey);
        check('切回后供应商下拉恢复', hasVendorField());

        // ---------- 供应商切换自动填 api/baseURL ----------
        const provSel = pqa('select')[0];
        const zhipuOpt = [...provSel.options].find(o => o.textContent.includes('智谱'));
        check('供应商下拉含智谱选项', !!zhipuOpt);
        provSel.value = zhipuOpt.value;
        provSel.dispatchEvent(new w.Event('change', { bubbles: true }));
        check('切换供应商后 baseURL 变化', /bigmodel\.cn/.test(preview()), preview().slice(0, 160));
        check('切换供应商后面板显示识别结果',
            /zhipu/.test(pq('.detected-vendor').textContent), pq('.detected-vendor').textContent);

        // ---------- 手改 URL 后不被供应商切换覆盖 ----------
        // 注意：API URL 现在**常显在面板主体**（原先折叠在「高级自定义」里，用户找不到模型入口）
        const urlIn = pq('#urlIn');
        check('API URL 常显（不再藏在折叠区）', !!urlIn);
        check('面板里已无「高级自定义」折叠区', !pq('.adv'), '应已整体移除');
        urlIn.value = 'https://my-gateway.example/v1';
        urlIn.dispatchEvent(new w.Event('input', { bubbles: true }));
        const sel2 = pqa('select')[0];
        const dsOpt = [...sel2.options].find(o => o.textContent.includes('DeepSeek'));
        sel2.value = dsOpt.value;
        sel2.dispatchEvent(new w.Event('change', { bubbles: true }));
        check('手改 URL 后切供应商不被覆盖',
            /my-gateway\.example/.test(preview()), preview().slice(0, 160));

        // ---------- 模型手动输入 ----------
        const mIn = pq('.models-input input');
        mIn.value = 'black-forest-labs/FLUX.1-schnell';
        pq('.models-input .btn').click();
        check('手动添加模型成功', /FLUX\.1-schnell/.test(preview()), preview().slice(0, 200));
        check('生图模型自动预填 kind=gen',
            /"kind":"gen"/.test(preview()), preview().slice(0, 240));
        check('模型 id 去掉了斜杠', /"id":"black-forest-labs-flux-1-schnell"/.test(preview()),
            preview().slice(0, 240));

        // ---------- kind 下拉可改 ----------
        const selRows = pqa('.sel-row');
        // 出厂连接现在钉 2 个模型（flash/pro），再加手动这 1 个 → 3 行。
        // 不写死数字、**按名字**定位要改的那一行 —— 按下标会在出厂默认变化时默默改错模型
        // （本轮就踩了：出厂从 1 个模型变成 2 个，selRows[1] 从 FLUX 变成了 pro）。
        check('已选列表行数 = 出厂模型数 + 手动加的 1',
            selRows.length === 3, selRows.length + ' 行：'
            + JSON.stringify(selRows.map(r => r.querySelector('.sel-name').textContent)));
        const fluxRow = selRows.find(r => /FLUX\.1-schnell/.test(r.querySelector('.sel-name').textContent));
        check('找到 FLUX 那一行', !!fluxRow);
        const kindSel = fluxRow.querySelector('select');
        kindSel.value = 'vision';
        kindSel.dispatchEvent(new w.Event('change', { bubbles: true }));
        d.getElementById('panelSave').click();
        check('改 kind 后输出为 vision', /"kind":"vision"/.test(preview()), preview().slice(0, 240));

        // ---------- 逐模型「请求与响应格式」（折叠，分块编辑） ----------
        {
            // 重新打开编辑面板（上一步已保存关闭）
            d.querySelector('.pcard .btn-edit').click();
            await sleep(80);

            // 编辑区是 .sel-row 的**兄弟**（挂在 .selected-list 下），不是它的子元素
            const editors = pqa('.selected-list > .json-editor');
            // 用"每个已选模型一个编辑区"这个**不变量**，不写死数字
            // （出厂默认的模型数会变，写死就会在别处默默失配）
            const rowCount = pqa('.sel-row').length;
            check('每个已选模型都有一个「请求与响应格式」编辑区',
                editors.length === rowCount && rowCount > 0, editors.length + ' vs ' + rowCount + ' 行');
            check('「请求与响应格式」默认折叠', editors.every(e => !e.open), JSON.stringify(editors.map(e => e.open)));
            check('折叠时标签写「请求与响应格式」',
                editors[0].querySelector('summary').textContent === '请求与响应格式',
                editors[0].querySelector('summary').textContent);
            // 命名不得与连接级那个撞车（此前两个都叫"请求覆盖"，看着像重复做了两遍）
            check('不存在名为「请求覆盖」的编辑区（命名撞车已消除）',
                !pqa('.json-editor > summary').some(s => s.textContent === '请求覆盖'),
                pqa('.json-editor > summary').map(s => s.textContent).join(' | '));
            // bodyMode 行**总是**渲染（避免提交时重建面板夺走焦点），无覆盖时禁用
            check('bodyMode 行总是存在（每个模型一行）',
                pqa('.body-mode-row').length === rowCount, String(pqa('.body-mode-row').length));
            check('无覆盖时 bodyMode 被禁用', pqa('.body-mode-row select').every(s => s.disabled),
                JSON.stringify(pqa('.body-mode-row select').map(s => s.disabled)));

            // 展开第一个，逐个定位子编辑区（嵌套较深，按 summary 文本找）
            const ed = editors[0];
            if (!ed) throw new Error('没渲染出请求与响应格式编辑区，后续断言无法进行');
            ed.open = true;
            await sleep(40);

            // 前缀匹配：标签在有内容时会带「（已设置）」后缀，精确匹配会漏
            const sub = (label) => [...ed.querySelectorAll('.json-editor')].find((e) => {
                const s = e.querySelector(':scope > summary');
                return s && s.textContent.startsWith(label);
            });
            const byLabel = (root, re) => [...root.querySelectorAll('.sub-field')].find((fl) => {
                const l = fl.querySelector('.sub-label');
                return l && re.test(l.textContent);
            });

            const bodyEd = sub('请求体 body');
            const respEd = sub('响应格式');
            const reqEd = sub('地址与请求头 request');
            const paramsEd = sub('可覆写参数 params');
            const promptEd = sub('提示词 prompt');
            check('有「请求体 body」子编辑区', !!bodyEd);
            check('有「响应格式」子编辑区', !!respEd);
            check('有「地址与请求头 request」子编辑区', !!reqEd);
            check('有「可覆写参数 params」子编辑区', !!paramsEd);
            check('有「提示词 prompt」子编辑区', !!promptEd);

            // ---- body：仍是 JSON 框（结构自由），非法不写回
            const ta = bodyEd.querySelector('textarea');
            check('body 是 JSON 文本框', !!ta);
            ta.value = '{ "model": ';
            ta.dispatchEvent(new w.Event('input', { bubbles: true }));
            await sleep(40);
            check('body 非法 JSON 就地报错', !bodyEd.querySelector('.json-err').hidden,
                bodyEd.querySelector('.json-err').textContent);
            check('body 非法 JSON 不写进配置', !/"request"/.test(preview()), preview().slice(0, 300));

            ta.value = '{"model":"{model}","prompt":"{prompt}"}';
            ta.dispatchEvent(new w.Event('input', { bubbles: true }));
            await sleep(40);
            check('body 合法后写进 request.body',
                /"request":\{"body":\{"model":"\{model\}"/.test(preview()), preview().slice(0, 320));

            // ---- response：**结构化表单**（本轮新增的重点）
            check('响应格式不是 JSON 框（是结构化字段）',
                respEd.querySelectorAll('.sub-field').length >= 3
                && !respEd.querySelector('.json-editor-body > textarea'),
                respEd.querySelectorAll('.sub-field').length + ' 个字段');

            const dpField = byLabel(respEd, /取数路径/);
            check('有 data_path 字段', !!dpField);
            const dp = dpField.querySelector('input');
            dp.value = 'output.choices.0.message.content.0.image';
            dp.dispatchEvent(new w.Event('input', { bubbles: true }));
            await sleep(40);
            check('data_path 写进 request.response',
                /"response":\{"data_path":"output\.choices\.0\.message\.content\.0\.image"/.test(preview()),
                preview().slice(0, 360));

            const dtField = byLabel(respEd, /数据类型/);
            const dt = dtField.querySelector('select');
            check('data_type 是下拉且取值固定',
                [...dt.options].map((o) => o.value).join(',') === ',url,base64,hex',
                [...dt.options].map((o) => o.value).join(','));
            dt.value = 'url';
            dt.dispatchEvent(new w.Event('change', { bubbles: true }));
            await sleep(40);
            check('data_type 写进配置', /"data_type":"url"/.test(preview()));

            const emField = byLabel(respEd, /错误信息路径/);
            check('有 error_message_path 字段', !!emField);

            // ---- 异步轮询（子折叠）
            const poll = sub('异步任务轮询');
            check('有「异步任务轮询」子折叠', !!poll);
            const tid = byLabel(poll, /任务号路径/).querySelector('input');
            tid.value = 'output.task_id';
            tid.dispatchEvent(new w.Event('input', { bubbles: true }));
            await sleep(40);
            check('task_id_path 写进配置', /"task_id_path":"output\.task_id"/.test(preview()));

            const pi = byLabel(poll, /轮询间隔/).querySelector('input');
            pi.value = '5';
            pi.dispatchEvent(new w.Event('input', { bubbles: true }));
            await sleep(40);
            check('轮询间隔按数字写进配置（不是字符串）', /"poll_interval":5\b/.test(preview()),
                preview().slice(0, 400));

            const sv = byLabel(poll, /成功状态值/).querySelector('input');
            sv.value = 'OK, DONE';
            sv.dispatchEvent(new w.Event('input', { bubbles: true }));
            await sleep(40);
            check('成功状态值按逗号拆成数组', /"success_values":\["OK","DONE"\]/.test(preview()),
                preview().slice(0, 420));

            // ---- 清空某个字段 → 该键应从配置里删掉（保持紧凑）
            dp.value = '';
            dp.dispatchEvent(new w.Event('input', { bubbles: true }));
            await sleep(40);
            check('清空字段会删掉该键', !/"data_path"/.test(preview()), preview().slice(0, 360));
            check('其它字段不受影响', /"task_id_path"/.test(preview()));

            // ---- 数字字段：非有限值**绝不能**写进配置
            // Number('abc')=NaN / Number('1e999')=Infinity，而 JSON.stringify 会把它们变成 null；
            // 插件侧 Number(null)===0 → poll_interval 变 0 → 不等待就轮询，打爆对方接口。
            //
            // 注意：<input type=number> 会把非法文本**消毒成空串**，所以"输入垃圾"这条路走不到
            // Infinity；真正能造出非有限值的是**导入**一份含 null/"" 的配置（下面单独测）。
            // 这里先把数值路径本身测扎实。
            {
                const pi2 = byLabel(poll, /轮询间隔/).querySelector('input');
                check('轮询间隔是 number 输入框', pi2.type === 'number', pi2.type);

                pi2.value = '';
                pi2.dispatchEvent(new w.Event('input', { bubbles: true }));
                await sleep(50);
                check('清空 → 删键（不写空串）', !/"poll_interval"/.test(preview()), preview().slice(0, 420));

                pi2.value = '7';
                pi2.dispatchEvent(new w.Event('input', { bubbles: true }));
                await sleep(50);
                check('合法数字写进配置且是数字类型', /"poll_interval":7\b/.test(preview()),
                    preview().slice(0, 420));

                // 小数与 0 都合法（0 有语义：不等待就轮询，提示里已说明）
                pi2.value = '0';
                pi2.dispatchEvent(new w.Event('input', { bubbles: true }));
                await sleep(50);
                check('0 是合法值（有明确语义）', /"poll_interval":0\b/.test(preview()), preview().slice(0, 420));
                pi2.value = '7';
                pi2.dispatchEvent(new w.Event('input', { bubbles: true }));
                await sleep(50);
            }

            // ---- bodyMode
            check('有覆盖后 bodyMode 解除禁用', pqa('.body-mode-row select')[0].disabled === false);
            const modeSel = pq('.body-mode-row select');
            modeSel.value = 'merge';
            modeSel.dispatchEvent(new w.Event('change', { bubbles: true }));
            await sleep(40);
            check('bodyMode=merge 写进配置', /"bodyMode":"merge"/.test(preview()), preview().slice(0, 360));

            // ---- 清空全部子编辑区 → request 整个消失
            ta.value = '';
            ta.dispatchEvent(new w.Event('input', { bubbles: true }));
            for (const root of [respEd, poll]) {
                for (const inp of [...root.querySelectorAll('input')]) {
                    if (inp.value) { inp.value = ''; inp.dispatchEvent(new w.Event('input', { bubbles: true })); }
                }
                // select 也要重置回空选项 —— 只清 input 会漏掉 data_type
                for (const s of [...root.querySelectorAll('select')]) {
                    if (s.value) { s.value = ''; s.dispatchEvent(new w.Event('change', { bubbles: true })); }
                }
            }
            await sleep(60);
            check('全部清空后 request 从配置里消失', !/"request"/.test(preview()), preview().slice(0, 320));
            check('清空后 bodyMode 重新禁用', pqa('.body-mode-row select').every((s) => s.disabled));

            d.getElementById('panelCancel').click();
            await sleep(80);
        }

        // ---------- 用途组「请求体覆盖」（折叠） ----------
        {
            const gb = qa('.group-bodies');
            check('存在「用途组请求体」折叠区', gb.length === 1, String(gb.length));
            check('「用途组请求体」默认折叠', gb[0] && !gb[0].open);

            await sleep(50);
            check('点遮罩关闭导入面板', d.getElementById('importPanel').hidden);

            // 6) 非标准分组：导入成功但有警告
            d.getElementById('importBtn').click();
            await sleep(50);
            d.getElementById('importText').value = JSON.stringify({
                version: 5,
                providers: [{
                    api: 'openai-completions', baseURL: 'https://api.deepseek.com/v1', apiKey: 'k',
                    models: [{ id: 'm', name: 'deepseek-chat' }],
                }],
                purposes: { chat: 'm' },
                groups: [{ purposes: ['chat'], body: { max_tokens: 7 } }],
            });
            d.getElementById('importConfirm').click();
            await sleep(120);
            check('非标准分组也导入成功', d.getElementById('importPanel').hidden);
            check('非标准分组给出警告', !d.getElementById('validationBox').hidden
                && /原样保留/.test(d.getElementById('validationBox').textContent),
                d.getElementById('validationBox').textContent);
            const cfg2 = JSON.parse(preview());
            check('非标准分组原样保留在导出里',
                JSON.stringify(cfg2.groups) === '[{"purposes":["chat"],"body":{"max_tokens":7}}]',
                JSON.stringify(cfg2.groups));
        }

            // 7) 含 null 的数值字段：导入必须原样保留（不擅自改用户数据），
            //    但插件侧不能把 null 当 0 用 —— 那条已由插件的 numOrDefault 兜住（见单测）。
            //    这里只钉住"生成器不改写用户数据"这一半。
            d.getElementById('importBtn').click();
            await sleep(60);
            d.getElementById('importText').value = JSON.stringify({
                version: 5,
                providers: [{
                    api: 'openai-completions', baseURL: 'https://x.example/v1', apiKey: 'k',
                    models: [{
                        id: 'm', name: 'qwen-image-3.0-pro', kind: 'gen',
                        request: {
                            body: { model: '{model}' },
                            response: { task_id_path: 'out.id', poll_url: 'https://x.example/t/{task_id}', poll_interval: null },
                        },
                    }],
                }],
                purposes: { 'image-generation': 'm' },
            });
            d.getElementById('importConfirm').click();
            await sleep(150);
            check('含 null 数值的配置能导入', d.getElementById('importPanel').hidden);
            const cfgN = JSON.parse(preview());
            const respN = cfgN.providers[0].models[0].request.response;
            check('导入不擅自改写用户的 null',
                'poll_interval' in respN && respN.poll_interval === null, JSON.stringify(respN));

            // 打开面板看该字段的呈现：null 应显示为空，而不是字符串 "null"
            d.querySelector('.pcard .btn-edit').click();
            await sleep(150);
            const edN = [...d.querySelectorAll('#panelBody .selected-list > .json-editor')].pop();
            edN.open = true;
            await sleep(80);
            const respEdN = [...edN.querySelectorAll('.json-editor')].find((e) => {
                const s = e.querySelector(':scope > summary'); return s && s.textContent.startsWith('响应格式');
            });
            const piN = [...respEdN.querySelectorAll('.sub-field')].find((fl) => {
                const l = fl.querySelector('.sub-label'); return l && /轮询间隔/.test(l.textContent);
            }).querySelector('input');
            check('null 在数字框里显示为空（不是 "null" 字样）', piN.value === '', JSON.stringify(piN.value));
            piN.value = '9';
            piN.dispatchEvent(new w.Event('input', { bubbles: true }));
            await sleep(60);
            check('改成合法值后 null 被替换成数字', /"poll_interval":9\b/.test(preview()),
                preview().slice(0, 420));
            d.getElementById('panelCancel').click();
            await sleep(80);
        // ---------- 恢复默认（出厂示例）----------
        //
        // 为什么需要这个按钮：草稿会自动存 localStorage，刷新加载的是**存档**而不是出厂示例，
        // 所以改了出厂示例后光刷新看不到效果 —— 必须有个"恢复默认"能把它拉回来。
        // 与「清空」语义不同：清空是空配置，恢复默认是出厂示例。
        {
            // confirm 在 headless 下默认返回 false（会直接 return，按钮等于没生效）
            const origConfirm = w.confirm;
            w.confirm = () => true;

            // 先造一个"和出厂不一样"的状态，否则测不出按钮真的做了事
            d.getElementById('clearBtn').click();
            await sleep(120);
            check('清空后是空配置（与出厂不同）',
                parsePreview().providers.length === 0, JSON.stringify(parsePreview().providers.length));

            d.getElementById('resetBtn').click();
            await sleep(200);
            const cfg = parsePreview();
            check('恢复默认后有 1 条连接', cfg.providers.length === 1, String(cfg.providers.length));
            check('  是 DeepSeek 连接', /api\.deepseek\.com/.test(cfg.providers[0].baseURL),
                cfg.providers[0].baseURL);
            check('  钉住两个模型', cfg.providers[0].models.length === 2,
                JSON.stringify(cfg.providers[0].models.map(m => m.name)));
            check('  模型名是 deepseek-flash / deepseek-pro',
                cfg.providers[0].models[0].name === 'deepseek-flash'
                && cfg.providers[0].models[1].name === 'deepseek-pro',
                JSON.stringify(cfg.providers[0].models.map(m => m.name)));
            check('  flash 声明 kind=vision（不是靠命名猜）',
                cfg.providers[0].models[0].kind === 'vision', String(cfg.providers[0].models[0].kind));
            check('  pro 声明 kind=text', cfg.providers[0].models[1].kind === 'text',
                String(cfg.providers[0].models[1].kind));
            check('  四个对话类用途全绑 flash',
                JSON.stringify(cfg.purposes) === JSON.stringify({
                    chat: ['flash'], compression: ['flash'], summarization: ['flash'], judge: ['flash'],
                }), JSON.stringify(cfg.purposes));

            // 界面上也要对得上：卡片角标、模型行。
            // 注意用 qa（全页）而不是 pqa —— pqa 是 #panelBody 作用域，而用途卡片在左栏。
            check('  用途卡片渲染出 4 个已绑定',
                qa('.purpose-chip.picked').length === 4, String(qa('.purpose-chip.picked').length));
            check('  4 个角标都是 1（各用途只绑一个）',
                qa('.purpose-chip.picked').every(c => c.querySelector('.rank-badge').textContent === '1'),
                JSON.stringify(qa('.purpose-chip.picked').map(c => c.querySelector('.rank-badge').textContent)));
            // 连接卡片显示模型数
            check('  连接卡片反映 2 个模型', /2 个模型/.test(qa('.pcard-meta').map(e => e.textContent).join(' ')),
                qa('.pcard-meta').map(e => e.textContent).join(' | '));

            // 关键：必须**落盘**，否则刷新又回到旧存档
            await sleep(500);
            const ls = w.localStorage.getItem('aiplugin4-config-v5-draft') || '';
            check('  恢复默认写进了草稿（刷新不会退回旧存档）',
                /deepseek-flash/.test(ls) && /deepseek-pro/.test(ls), ls.slice(0, 200));

            w.confirm = origConfirm;
        }

        // ---------- 顺序调整（providers[] 顺序即插件连接顺序，是真实语义） ----------
        {
            // 先建第二条连接，才能测顺序
            q('.pcard-add').click();
            const k2 = pq('.key-row input');
            k2.value = 'sk-second';
            k2.dispatchEvent(new w.Event('input', { bubbles: true }));
            d.getElementById('panelSave').click();

            const before = parsePreview().providers.map((p, i) => i);
            const firstHostBefore = /\/\/([^/]+)/.exec(parsePreview().providers[0].baseURL)[1];
            const secondHostBefore = /\/\/([^/]+)/.exec(parsePreview().providers[1].baseURL)[1];
            check('调序前有 2 条连接', before.length === 2, before.length);

            // 第一张卡片的 ↓ 按钮
            const downBtn = qa('.pcard .btn-move')[1];
            check('首卡 ↓ 可用', downBtn && !downBtn.disabled);
            downBtn.click();

            const after = parsePreview().providers;
            const firstHostAfter = /\/\/([^/]+)/.exec(after[0].baseURL)[1];
            const secondHostAfter = /\/\/([^/]+)/.exec(after[1].baseURL)[1];
            check('下移后两条连接位置互换',
                firstHostAfter === secondHostBefore && secondHostAfter === firstHostBefore,
                `${firstHostBefore},${secondHostBefore} -> ${firstHostAfter},${secondHostAfter}`);

            // 末位卡片的 ↑ 把它挪回去
            const lastIdx = qa('.pcard').length - 2;   // 末位是「+ 添加」卡
            const upBtn = [...qa('.pcard .btn-move')][lastIdx * 2];
            check('末卡 ↑ 可用', upBtn && !upBtn.disabled);
            upBtn.click();
            const restored = parsePreview().providers;
            check('上移后恢复原顺序',
                /\/\/([^/]+)/.exec(restored[0].baseURL)[1] === firstHostBefore,
                /\/\/([^/]+)/.exec(restored[0].baseURL)[1]);

            check('首卡 ↑ 被禁用', qa('.pcard .btn-move')[0].disabled);
            check('末卡 ↓ 被禁用', [...qa('.pcard .btn-move')].slice(-2)[1].disabled);
        }

        // ---------- API Key 会保存在本机浏览器里（刷新不丢） ----------
        //
        // 这是**行为契约**。此前是"永不落盘"（每次刷新都要重贴）—— 已确认不采用：
        // 本机静态页面，而 Key 本来就已经明文存在海豹配置里，同一个信任边界，
        // 再存一份到 localStorage 的增量风险很小，不值得用"反复粘贴"去换。
        // 若将来要改回不落盘，这条会立刻失败，提醒你同步改提示文案。
        check('界面上没有「记住 Key」开关（一律保存，不做开关）', !d.getElementById('rememberKey'));
        q('.pcard .btn-edit').click();
        const kIn = pq('.key-row input');
        kIn.value = 'sk-PERSIST-ME';
        kIn.dispatchEvent(new w.Event('input', { bubbles: true }));
        // 提示文案要在面板**开着**时查（panelSave 会把面板关掉）
        check('提示写清"会保存在本机浏览器里"',
            /会保存在本机浏览器里/.test(pqa('.field-note').map((e) => e.textContent).join(' ')),
            pqa('.field-note').map((e) => e.textContent).join(' | ').slice(0, 200));
        check('  并提示公用电脑用「清空」擦掉',
            /公用电脑/.test(pqa('.field-note').map((e) => e.textContent).join(' ')),
            pqa('.field-note').map((e) => e.textContent).join(' | ').slice(0, 200));

        // Key 输入框只调 renderOutput()，落盘要靠 savePanel 触发 scheduleSave
        d.getElementById('panelSave').click();
        const dump = () => {
            const o = {};
            for (let i = 0; i < w.localStorage.length; i++) {
                const k = w.localStorage.key(i);
                o[k] = w.localStorage.getItem(k);
            }
            return JSON.stringify(o);
        };
        // 草稿是 300ms 防抖，等一会儿再看
        const t0 = Date.now();
        const wait = () => {
            if (Date.now() - t0 > 1500) {
                const ls = dump();
                check('localStorage 里保存了 API Key（刷新不丢）',
                    ls.includes('sk-PERSIST-ME'), ls.slice(0, 220));
                check('localStorage 里确实存了草稿', ls.includes('providers'), ls.slice(0, 220));
                check('预览里也有该 key（不只是草稿里有）',
                    /sk-PERSIST-ME/.test(preview()), preview().slice(0, 160));
                finish();
                return;
            }
            setTimeout(wait, 100);
        };
        setTimeout(wait, 100);

    } catch (e) {
        log.push('FAIL  脚本异常 :: ' + (e && e.message) + ' @ ' + (e && e.stack || '').split('\n')[1]);
        finish();
    }

    function finish() {
        const ol = document.getElementById('results');
        ol.innerHTML = '';
        for (const l of log) {
            const li = document.createElement('li');
            li.textContent = l;
            li.style.color = l.startsWith('PASS') ? 'green' : 'red';
            li.style.fontFamily = 'monospace';
            ol.appendChild(li);
        }
        const fails = log.filter(l => l.startsWith('FAIL')).length;
        const s = document.createElement('div');
        s.id = 'summary';
        s.textContent = `RESULT ${log.length - fails} passed / ${fails} failed`;
        document.body.appendChild(s);
    }
};
</script>
</body>
</html>
