<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>导入导出往返检查</title></head>
<body>
<pre id="out">running…</pre>
<iframe id="frame" src="/index.html" width="1500" height="950"></iframe>
<script>
// 导入导出往返检查（v5 配置）。
//
// 这轮的重点变化：**用途组（groups）已停用** —— 请求体覆盖改走
// models[].request.bodyByUse。所以这里验证：
//   1. 旧配置里的 groups 被丢弃 + 明确警告，但 models[].request 原样保留
//   2. 导出 → 再导入幂等（不漂移）
//   3. 界面改某条 bodyByUse 生效，且不冲掉其它字段
// 测试必须从**干净状态**开始：生成器会把草稿存 localStorage。
try { localStorage.clear(); } catch (e) { /* 隐私模式等忽略 */ }

const lines = [];
const frame = document.getElementById('frame');
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
let legacyUpgraded = false;

frame.onload = async () => {
    const w = frame.contentWindow, d = frame.contentDocument;
    const q = (s) => d.querySelector(s);
    const preview = () => d.getElementById('preview').textContent;
    const warnText = () => {
        const b = d.getElementById('validationBox');
        return b && !b.hidden ? b.textContent : '';
    };
    // JSON 对象**键序无语义** —— 生成器会按自己的字段顺序规范化输出。
    // 所以比较要按"键排序后的规范形式"，不能用字符串全等。
    const canon = (s) => {
        const sort = (v) => {
            if (Array.isArray(v)) return v.map(sort);
            if (v && typeof v === 'object') {
                const o = {};
                for (const k of Object.keys(v).sort()) o[k] = sort(v[k]);
                return o;
            }
            return v;
        };
        try { return JSON.stringify(sort(JSON.parse(s))); } catch { return s; }
    };
    const same = (a, b) => canon(a) === canon(b);
    const importCfg = async (text) => {
        d.getElementById('importBtn').click();
        await sleep(50);
        d.getElementById('importText').value = text;
        d.getElementById('importConfirm').click();
        await sleep(150);
    };

    // ---- 1) 导入一份"旧格式"配置：带 groups + 逐模型 bodyByUse 与各类边角字段 ----
    const legacy = {
        version: 5,
        providers: [
            {
                api: 'anthropic-messages', baseURL: 'https://api.anthropic.com/v1',
                apiKey: 'sk-ant-real', provider: 'anthropic', displayName: 'Claude 主用', timeout: 45,
                request: { list_url: 'https://api.anthropic.com/v1/models' },
                models: [
                    {
                        id: 'sonnet', name: 'claude-sonnet-4-5', kind: 'vision', contextWindow: 200000, maxTokens: 8192,
                        request: { bodyByUse: {
                            chat: { temperature: 0.7, max_tokens: 4096 },
                            'image-understanding': { max_tokens: 2048 },
                        } },
                    },
                    { id: 'haiku', name: 'claude-haiku-4-5' },
                ],
            },
            {
                api: 'openai-completions', baseURL: 'https://api.siliconflow.cn/v1',
                apiKey: 'sk-sf',
                models: [{
                    id: 'flux', name: 'black-forest-labs/FLUX.1-schnell', kind: 'gen',
                    bodyMode: 'replace',
                    request: {
                        body: { model: '{model}', prompt: '{prompt}', image_size: '{size}' },
                        response: { data_path: 'images.0.url', data_type: 'url' },
                        params: { size: { type: 'string', default: '1024x1024', desc: '尺寸' } },
                    },
                }],
            },
        ],
        purposes: { chat: ['sonnet'], 'image-understanding': ['sonnet'], 'image-generation': ['flux'] },
        // 旧机制遗留：导入时必须丢弃并警告
        groups: [
            { purposes: ['chat', 'summarization', 'judge'], body: { temperature: 0.7, max_tokens: 4096 } },
            { purposes: ['image-understanding'], body: { max_tokens: 2048 } },
        ],
    };
    await importCfg(JSON.stringify(legacy));
    const afterImport = preview();
    const cfgAfter = JSON.parse(afterImport);
    lines.push('导入成功: ' + d.getElementById('importPanel').hidden);
    lines.push('给出「用途组请求体已停用」警告: ' + (/用途组请求体/.test(warnText()) && /已停用/.test(warnText())));
    lines.push('导出不再有 groups: ' + !/"groups"/.test(afterImport));
    lines.push('逐模型 bodyByUse 原样保留: ' + (JSON.stringify(cfgAfter.providers[0].models[0].request.bodyByUse)
        === JSON.stringify(legacy.providers[0].models[0].request.bodyByUse)));
    lines.push('连接级 request 保留: ' + (cfgAfter.providers[0].request.list_url === 'https://api.anthropic.com/v1/models'));
    lines.push('逐模型 body/response/params 保留: ' + (JSON.stringify(cfgAfter.providers[1].models[0].request)
        === JSON.stringify(legacy.providers[1].models[0].request)));

    // ---- 2) 什么都不改，直接再走一次导入导出（幂等性） ----
    await importCfg(afterImport);
    const afterSecond = preview();
    lines.push('二次往返仍一致: ' + same(afterSecond, afterImport));
    lines.push('二次导入不再有用途组警告: ' + !/用途组请求体/.test(warnText()));

    // ---- 3) 界面上改一条 bodyByUse，确认改动生效且其它字段没被冲掉 ----
    q('.pcard .btn-edit').click();
    await sleep(150);
    const useEds = [...d.querySelectorAll('#panelBody .selected-list > .use-body-editor')];
    // sonnet（vision，有 2 条）与 haiku（text，0 条）各一个折叠；flux 是 gen → 不提供入口
    lines.push('');
    lines.push('面板里「用途请求体」折叠数（sonnet + haiku）: ' + useEds.length);
    const sonnetEd = useEds.find((e) => /已设置 2 条/.test(e.querySelector(':scope > summary').textContent));
    lines.push('  sonnet 的折叠标了「已设置 2 条」: ' + !!sonnetEd);
    const chatRow = sonnetEd
        ? [...sonnetEd.querySelectorAll('.use-body-row')].find((r) => r.querySelector('select').value === 'chat')
        : null;
    lines.push('  找到 chat 那一行: ' + !!chatRow);
    if (chatRow) {
        const ta = chatRow.querySelector('textarea');
        ta.value = '{"temperature":0.2,"max_tokens":1234}';
        ta.dispatchEvent(new w.Event('input', { bubbles: true }));
        await sleep(100);
    }
    const edited = JSON.parse(preview());
    lines.push('改后 bodyByUse.chat: ' + JSON.stringify(edited.providers[0].models[0].request.bodyByUse.chat));
    lines.push('改后仍有第二个连接: ' + (edited.providers.length === 2));
    lines.push('改后 connection-level request 仍在: ' + JSON.stringify(edited.providers[0].request));
    lines.push('改后 displayName/timeout 仍在: '
        + JSON.stringify(edited.providers[0].displayName) + '/' + edited.providers[0].timeout);
    lines.push('改后逐模型 request.params 仍在: '
        + JSON.stringify(edited.providers[1].models[0].request.params));
    lines.push('改后 modelId 引用未被破坏: ' + JSON.stringify(edited.purposes));
    d.getElementById('panelCancel').click();
    await sleep(100);
    lines.push('取消编辑后预览回到导入结果（草稿被丢弃）: ' + same(preview(), afterSecond));

    // ---- 4) 把改后的再导入一次，确认仍稳定 ----
    const editedText = JSON.stringify(edited);
    await importCfg(editedText);
    lines.push('改动后再往返一致: ' + same(preview(), editedText));

    // 固化判定值（后面的单字符串测试会改状态，重算就失真了）
    const rtOk = !/"groups"/.test(afterImport)
        && JSON.stringify(cfgAfter.providers[0].models[0].request.bodyByUse)
            === JSON.stringify(legacy.providers[0].models[0].request.bodyByUse)
        && cfgAfter.providers[0].request.list_url === 'https://api.anthropic.com/v1/models';
    const idemOk = same(afterSecond, afterImport);
    const editOk = same(preview(), editedText)
        && edited.providers.length === 2
        && edited.providers[0].models[0].request.bodyByUse.chat.max_tokens === 1234
        && JSON.stringify(edited.providers[1].models[0].request.params)
            === JSON.stringify(legacy.providers[1].models[0].request.params);
    const pass = rtOk && idemOk && editOk;

    // ---- 5) 单字符串写法（手写配置常见）必须被**升级为有序数组** ----
    {
        const single = JSON.stringify({
            version: 5,
            providers: [{ api: 'openai-completions', baseURL: 'https://api.deepseek.com/v1', apiKey: 'k',
                models: [{ id: 'm', name: 'deepseek-chat' }] }],
            purposes: { chat: 'm' },
        });
        await importCfg(single);
        const up = JSON.parse(preview());
        lines.push('');
        lines.push('单字符串 purposes 导入后: ' + JSON.stringify(up.purposes));
        lines.push('  已升级为数组: ' + (Array.isArray(up.purposes.chat) && up.purposes.chat[0] === 'm'));
        lines.push('  再往返稳定: ' + (JSON.stringify(JSON.parse(preview()).purposes) === JSON.stringify(up.purposes)));
        legacyUpgraded = Array.isArray(up.purposes.chat) && up.purposes.chat[0] === 'm';
    }

    const summary = 'SUMMARY roundTrip=' + rtOk + ' idempotent=' + idemOk
        + ' editStable=' + editOk + ' allPass=' + pass + ' legacyUpgraded=' + legacyUpgraded;
    lines.push('');
    lines.push(summary);
    document.getElementById('out').textContent = lines.join('\n');
    const s = document.createElement('div');
    s.id = 'summary';
    s.textContent = summary;
    document.body.appendChild(s);
};
</script>
</body>
</html>
