<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>联网分区统一交互测试</title></head>
<body>
<h1>联网分区统一交互测试</h1>
<ol id="results"></ol>
<iframe id="frame" src="/index.html" width="1500" height="950"></iframe>
<script>
try { localStorage.clear(); } catch (e) { /* ignore */ }
const log = [];
function check(name, cond, extra) {
    log.push((cond ? 'PASS  ' : 'FAIL  ') + name + (cond ? '' : '  :: ' + (extra ?? '')));
}
function render() {
    const ol = document.getElementById('results');
    ol.innerHTML = '';
    for (const line of log) {
        const li = document.createElement('li');
        li.textContent = line;
        ol.appendChild(li);
    }
}
const f = document.getElementById('frame');

f.onload = async () => {
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const w = f.contentWindow;
    const d = f.contentDocument;
    w.confirm = () => true;
    const q = (s) => d.querySelector(s);
    const shown = (elm) => {
        if (!elm) return false;
        const cs = w.getComputedStyle(elm);
        return cs.display !== 'none' && cs.visibility !== 'hidden';
    };
    try {
        await sleep(100);
        d.querySelector('[data-view="web"]').click();
        await sleep(60);
        check('联网页签可用', shown(d.getElementById('webLayout')));
        check('联网默认 2 个 provider（DeepSeek + SearXNG）',
            d.querySelectorAll('#webProviderList .pcard:not(.pcard-add)').length === 2,
            d.querySelectorAll('#webProviderList .pcard:not(.pcard-add)').length);

        // 启用开关：关闭 = 从输出移除，不写 enabled 键
        const webToggle = d.querySelector('#webProviderList .pcard input[type="checkbox"]');
        check('联网 provider 卡片有启用开关', !!webToggle);
        webToggle.checked = false;
        webToggle.dispatchEvent(new w.Event('change', { bubbles: true }));
        await sleep(60);
        const webCfg = JSON.parse(d.getElementById('webPreview').textContent);
        check('停用 provider 后输出移除', webCfg.providers.length === 1, JSON.stringify(webCfg.providers.map(p => p.id)));
        check('联网输出不含 enabled 键', !JSON.stringify(webCfg).includes('"enabled"'));
        // 重新启用，避免影响后续编辑
        const webToggle2 = d.querySelector('#webProviderList .pcard input[type="checkbox"]');
        webToggle2.checked = true;
        webToggle2.dispatchEvent(new w.Event('change', { bubbles: true }));
        await sleep(60);

        // 编辑按钮打开统一右侧面板
        const card = d.querySelector('#webProviderList .pcard');
        const editBtn = [...card.querySelectorAll('button')].find(b => b.textContent.trim() === '编辑');
        editBtn.click();
        await sleep(50);
        check('编辑打开统一右侧面板', shown(d.getElementById('sidePanel')));
        check('面板里是 provider 表单', !!d.querySelector('#sidePanelBody .web-edit'));

        const keyInput = [...d.querySelectorAll('#sidePanelBody input')].find(i => i.placeholder === 'sk-…');
        check('找到 API Key 输入框', !!keyInput);
        keyInput.value = 'sk-UI-STANDARD';
        keyInput.dispatchEvent(new w.Event('input', { bubbles: true }));
        d.getElementById('sidePanelSave').click();
        await sleep(60);
        check('保存后预览包含 API Key', d.getElementById('webPreview').textContent.includes('sk-UI-STANDARD'));
        check('保存后面板关闭', !shown(d.getElementById('sidePanel')));

        // 取消要回滚
        [...d.querySelector('#webProviderList .pcard').querySelectorAll('button')]
            .find(b => b.textContent.trim() === '编辑').click();
        await sleep(40);
        const keyInput2 = [...d.querySelectorAll('#sidePanelBody input')].find(i => i.placeholder === 'sk-…');
        keyInput2.value = 'sk-ROLLBACK';
        keyInput2.dispatchEvent(new w.Event('input', { bubbles: true }));
        d.getElementById('sidePanelCancel').click();
        await sleep(60);
        check('取消后回滚 API Key', d.getElementById('webPreview').textContent.includes('sk-UI-STANDARD')
            && !d.getElementById('webPreview').textContent.includes('sk-ROLLBACK'));

        // 导入按钮打开统一导入对话框
        d.getElementById('webImportBtn').click();
        await sleep(30);
        check('联网导入使用统一对话框', shown(d.getElementById('importPanel')));
        d.getElementById('importCancel').click();
        await sleep(20);
    } catch (e) {
        check('测试过程未抛异常', false, e instanceof Error ? e.stack : String(e));
    }
    render();
    document.title = `DONE ${log.filter(x => x.startsWith('FAIL')).length}`;
};
</script>
</body>
</html>
